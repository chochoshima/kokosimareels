<script>
const WORKER_URL = "https://visitor-counter.kokopujiyanto.workers.dev";
const params = new URLSearchParams(window.location.search);
const promptId = params.get("id");

if (!promptId || !PROMPT_DATABASE[promptId]) {
    window.location.href = "index.html";
} else {
    const data = PROMPT_DATABASE[promptId];
    document.title = data.title + " | Kokosima AI";
    document.getElementById("title").textContent = data.title;
    document.getElementById("promptText").textContent = data.text;

    /* --- GANTI BAGIAN INI --- */
const img = document.getElementById("main-image");
const imageBase = `images/${promptId}`;

// Pastikan gambar tidak tersembunyi secara default
img.hidden = false;
img.style.display = "block";

// Coba muat WEBP, jika gagal pindah ke JPG
img.src = `${imageBase}.webp`;
img.onerror = () => {
    if (!img.src.endsWith('.jpg')) {
        img.src = `${imageBase}.jpg`;
    }
};

// Update Meta Tags secara Dinamis
document.getElementById("meta-title").content = data.title;
/* ------------------------ */
document.getElementById("meta-desc").content = data.text.substring(0, 150) + "...";
document.getElementById("meta-img").content = window.location.origin + `/images/${promptId}.webp`;

    // Sinkronisasi Cusdis
    window.addEventListener('load', () => {
        const d = document.getElementById('cusdis_thread');
        if (d) {
            d.setAttribute('data-page-id', promptId);
            d.setAttribute('data-page-url', window.location.href);
            d.setAttribute('data-page-title', data.title);
        }
    });

    // Copy Logic
    document.getElementById("copyBtn").onclick = async () => {
        await navigator.clipboard.writeText(data.text);
        const btn = document.getElementById("copyBtn");
        btn.innerHTML = "✅ Done";
        setTimeout(() => { btn.innerHTML = "📋 Copy"; }, 1600);
    };
    document.getElementById("copyBtn").innerHTML = "📋 Copy";

    // Like Logic yang diperbaiki
const likeBtn = document.getElementById('likeBtn');
const likeCountLabel = document.getElementById('likeCount');

async function initLikes() {
    try {
        const res = await fetch(`${WORKER_URL}/?action=get&imageId=${promptId}`);
        const text = await res.text();
        console.log("INIT RAW:", text);

        const result = JSON.parse(text);
        likeCountLabel.innerText = result.likes || 0;

        if (localStorage.getItem('liked_' + promptId)) {
            likeBtn.classList.add('active');
        }
    } catch (e) {
        console.error("INIT LIKE ERROR:", e);
    }
}

likeBtn.onclick = async () => {
    console.log("LIKE CLICKED");

    if (localStorage.getItem('liked_' + promptId)) {
        alert("Anda sudah memberikan Like! 😊");
        return;
    }

    likeBtn.disabled = true;

    try {
        const res = await fetch(
            `${WORKER_URL}/?action=like&imageId=${promptId}`,
            { method: 'POST' }
        );

        const text = await res.text();
        console.log("POST RAW:", text);

        const result = JSON.parse(text);
        likeCountLabel.innerText = result.likes;
        likeBtn.classList.add('active');
        localStorage.setItem('liked_' + promptId, 'true');

    } catch (e) {
        console.error("LIKE ERROR:", e);
        alert("Like gagal");
    } finally {
        likeBtn.disabled = false;
    }
};

initLikes();

    // PAKSA VISITOR TAMPIL (PENTING!)
    const fixVisitor = () => {
        const v = document.getElementById('visitorBar');
        if(v) {
            v.style.setProperty('display', 'inline-flex', 'important');
            v.style.setProperty('position', 'static', 'important');
            v.style.setProperty('visibility', 'visible', 'important');
        }
    }
    fixVisitor();
    setTimeout(fixVisitor, 1500); // Jalankan ulang setelah visitor.js dimuat
}
</script>
<script src="visitor.js" defer></script>
<script>
const promptSearch = document.getElementById('searchInput');

if (promptSearch) {
    promptSearch.addEventListener('keypress', (e) => {
        // Hanya pindah ke index jika user tekan ENTER
        if (e.key === 'Enter') {
            const term = promptSearch.value.trim();
            if (term !== "") {
                window.location.href = `index.html?search=${encodeURIComponent(term)}`;
            }
        }
    });
}
</script>
