<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="main-desc-meta" content="Temukan prompt AI cinematic gratis.">

    <title>Loading Prompt... | Kokosima AI</title>

    <meta property="og:type" content="article">
    <meta property="og:title" id="meta-title" content="Kokosima AI">
    <meta property="og:description" id="meta-desc" content="Temukan prompt AI cinematic gratis.">
    <meta property="og:url" id="meta-url" content="https://kokosimareels.pages.dev/">
    <meta property="og:image" id="meta-img" content="https://kokosimareels.pages.dev/images/default-preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <link rel="stylesheet" href="style.css">

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id');
        const canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = currentId ? `https://kokosimareels.pages.dev/prompt.html?id=${currentId}` : 'https://kokosimareels.pages.dev/';
        document.head.appendChild(canonical);
    </script>
</head>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-link">
        <span class="brain-icon">🧠</span>
        <span class="logo-text">kokosima</span>
    </a>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cari (hutan, robot, neon...)" autocomplete="off">
    </div>

    <div class="social-links">
        <a href="panduan-prompt.html" class="btn-ai-nav">
            <i class="fas fa-magic"></i> 
            <span class="text-label">Cara Membuat Gambar AI</span>
        </a>
        <a href="https://www.facebook.com/chochoshima/" target="_blank" class="nav-social">
    <i class="fab fa-facebook"></i> Facebook
</a>
<a href="https://www.youtube.com/@kokosimaabsurd/" target="_blank" class="nav-social">
    <i class="fab fa-youtube"></i> YouTube
</a>
    </div>
</header>

<main class="prompt-page-wrapper">
  <div class="prompt-card"> 
    
    <div class="media-container">
      <img id="main-image" alt="Prompt Preview" hidden>
    </div>

    <div class="content-container">
      <h3 id="title">Loading...</h3>
      <p id="promptText">Memuat prompt...</p>
      
      <div class="actions">
    <button class="btn btn-primary" id="copyBtn">📋 Copy</button>
    <button class="btn-like" id="likeBtn">❤️ <span id="likeCount">0</span></button>
    <div class="visitor-inline" id="visitorBar">
        👁️ <span id="visitorToday">0</span>&nbsp;hari ini &nbsp;•&nbsp; 
        <strong id="visitorTotal">0</strong>&nbsp;total
    </div>
</div>

      <div id="comment-section" style="margin-top: 15px; border-top: 1px solid var(--border-soft); padding-top: 15px; width: 100%;">
          <h4 style="margin-bottom: 15px; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">💬 Kesan & Pesan</h4>
          
          <div id="cusdis_thread"
            data-host="https://cusdis.com"
            data-app-id="69785bf6-5db3-4bd7-b825-141cbd5e2440"
            data-theme="dark"
            style="width: 100%;">
          </div>
      </div>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>

<script>
const WORKER_URL = "https://visitor-counter.kokopujiyanto.workers.dev";
const params = new URLSearchParams(window.location.search);
const promptId = params.get("id");

if (!promptId || !PROMPT_DATABASE[promptId]) {
    window.location.href = "index.html";
} else {
    const data = PROMPT_DATABASE[promptId];
    document.title = data.title + " | Kokosima AI";
    document.getElementById("title").textContent = data.title;
    document.getElementById("promptText").textContent = data.text;

    const img = document.getElementById("main-image");
    img.src = `images/${promptId}.webp`;
    img.onerror = () => img.src = `images/${promptId}.jpg`;
    img.onload = () => img.hidden = false;

    // Sinkronisasi Cusdis
    window.addEventListener('load', () => {
        const d = document.getElementById('cusdis_thread');
        if (d) {
            d.setAttribute('data-page-id', promptId);
            d.setAttribute('data-page-url', window.location.href);
            d.setAttribute('data-page-title', data.title);
        }
    });

    // Copy Logic
    document.getElementById("copyBtn").onclick = async () => {
        await navigator.clipboard.writeText(data.text);
        const btn = document.getElementById("copyBtn");
        btn.innerHTML = "✅ Done";
        setTimeout(() => { btn.innerHTML = "📋 Copy"; }, 1600);
    };
    document.getElementById("copyBtn").innerHTML = "📋 Copy";

    // Like Logic
    const likeBtn = document.getElementById('likeBtn');
    const likeCountLabel = document.getElementById('likeCount');

    async function initLikes() {
        try {
            const res = await fetch(`${WORKER_URL}/?action=like&imageId=${promptId}`);
            const result = await res.json();
            likeCountLabel.innerText = result.likes || 0;
            if (localStorage.getItem('liked_' + promptId)) likeBtn.classList.add('active');
        } catch (e) {}
    }

    likeBtn.onclick = async () => {
        if (localStorage.getItem('liked_' + promptId)) {
            alert("Anda sudah memberikan Like! 😊");
            return;
        }
        likeBtn.disabled = true;
        try {
            const res = await fetch(`${WORKER_URL}/?action=like&imageId=${promptId}`, { method: 'POST' });
            const result = await res.json();
            likeCountLabel.innerText = result.likes;
            likeBtn.classList.add('active');
            localStorage.setItem('liked_' + promptId, 'true');
        } catch (e) {} finally {
            likeBtn.disabled = false;
        }
    };
    initLikes();

    // PAKSA VISITOR TAMPIL (PENTING!)
    const fixVisitor = () => {
        const v = document.getElementById('visitorBar');
        if(v) {
            v.style.setProperty('display', 'inline-flex', 'important');
            v.style.setProperty('position', 'static', 'important');
            v.style.setProperty('visibility', 'visible', 'important');
        }
    }
    fixVisitor();
    setTimeout(fixVisitor, 1500); // Jalankan ulang setelah visitor.js dimuat
}
</script>
<script src="visitor.js" defer></script>
</body>
</html>
