<main class="feed" id="main-feed"></main>

<script src="data.js"></script>
<script>
const WORKER_URL = "https://visitor-counter.kokopujiyanto.workers.dev";
const CHANNEL_YOUTUBE = "https://youtube.com/@kokosimaabsurd";
const feedContainer = document.getElementById("main-feed");

/* ==========================
   OPTIMIZED LIKE OBSERVER
========================== */
const likeObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const id = entry.target.id;
            fetchLikeCount(id);
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.1 });

async function fetchLikeCount(id) {
    const label = document.getElementById(`idx-like-${id}`);
    try {
        const res = await fetch(`${WORKER_URL}/?action=like&imageId=${id}`);
        const result = await res.json();
        if (label) label.innerText = result.likes || 0;
    } catch (e) {
        if (label) label.innerText = "0";
    }
}
/* ==========================
   FEED GENERATOR
========================== */
function generateFeed(keysToRender = null) {
    if (typeof PROMPT_DATABASE === 'undefined') {
        feedContainer.innerHTML = `<div style="text-align:center; padding: 2rem; color: #cc0000;"><h3>Gagal Memuat Data</h3></div>`;
        return;
    }

    feedContainer.innerHTML = "";
    const fragment = document.createDocumentFragment();
    let keys = keysToRender || Object.keys(PROMPT_DATABASE);
    if (!keysToRender) keys = [...keys].reverse();

    if (keys.length === 0) {
        feedContainer.innerHTML = `<div class="no-results"><h3>Prompt tidak ditemukan...</h3></div>`;
        return;
    }

    keys.forEach(id => {
        try {
            const data = PROMPT_DATABASE[id];
            if (!data || !data.title) return;

            const safeText = data.text || ""; 
            const previewText = safeText.split(/\s+/).slice(0, 10).join(" ") + "...";

            // LOGIKA TOMBOL VIDEO OTOMATIS
            const hasVideo = data.videoUrl && data.videoUrl !== "#" && data.videoUrl !== "";
            const isSpecificVideo = hasVideo && (data.videoUrl.includes('watch') || data.videoUrl.includes('shorts') || data.videoUrl.includes('youtu.be'));

            // Tentukan Label dan Class CSS
            const btnLabel = isSpecificVideo ? "▶ Video" : "<i class='fas fa-tv'></i>"; 
            const btnClass = isSpecificVideo ? "btn btn-primary" : "btn btn-yt-red btn-icon-only";
            const btnHref = hasVideo ? data.videoUrl : CHANNEL_YOUTUBE;

            const section = document.createElement("section");
            section.className = "item";
            section.id = id;
            section.innerHTML = `
                <div class="media-container">
                    <div class="like-badge-index">❤️ <span id="idx-like-${id}">...</span></div>
                    <img src="images/${id}.webp" alt="${data.title}" loading="lazy" decoding="async"
                    onerror="this.onerror=null;this.src='images/${id}.jpg';">
                </div>
                <div class="content-container">
                    <h3 title="${data.title}">${data.title}</h3>
                    <p class="prompt-preview">${previewText}</p>
                    <div class="actions">
                        <a class="${btnClass}" href="${btnHref}" target="_blank">${btnLabel}</a>
                        <a class="btn btn-outline" href="prompt.html?id=${id}">PROMPT</a>
                        <button class="btn btn-share" onclick="sharePrompt('${id}')">🔗</button>
                    </div>
                </div>
            `;
            fragment.appendChild(section);
            likeObserver.observe(section);
        } catch (err) { console.error(err); }
    });
    feedContainer.appendChild(fragment);
}

// Search Logic
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    if (term === "") { generateFeed(); return; }
    const filtered = Object.keys(PROMPT_DATABASE).filter(id => 
        (PROMPT_DATABASE[id].title + PROMPT_DATABASE[id].text).toLowerCase().includes(term)
    );
    generateFeed(filtered);
});

function sharePrompt(id) {
    const url = `${window.location.origin}/prompt.html?id=${id}`;
    if (navigator.share) {
        navigator.share({ title: PROMPT_DATABASE[id].title, url });
    } else {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
    }
}

// Jalankan Feed Pertama Kali
generateFeed();

/* ========================================================
   LOGIKA TANGKAP PENCARIAN DARI URL (DARI PROMPT.HTML)
   ======================================================== */
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get('search');
    
    if (searchQuery) {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.value = searchQuery; // Masukkan teks ke kolom cari
            
            // Jalankan filter otomatis sesuai database
            const term = searchQuery.toLowerCase();
            const filtered = Object.keys(PROMPT_DATABASE).filter(id => 
                (PROMPT_DATABASE[id].title + PROMPT_DATABASE[id].text).toLowerCase().includes(term)
            );
            generateFeed(filtered);
        }
    }
});
</script>

<div class="floating-stack">
  <div class="floating-visitor" id="visitorBar">👁️ <span id="visitorToday">0</span> · <strong id="visitorTotal">0</strong></div>
  <a href="https://youtube.com/@kokosimaabsurd" class="floating-youtube" target="_blank">▶</a>
</div>
<script src="visitor.js" defer></script>
<script>
    const stack = document.querySelector('.floating-stack');
    let isScrolling;

    const handleScroll = () => {
        stack.classList.add('is-scrolling');
        window.clearTimeout(isScrolling);
        isScrolling = setTimeout(() => {
            stack.classList.remove('is-scrolling');
        }, 400);
    };

    // Listen ke window (Desktop)
    window.addEventListener('scroll', handleScroll, { passive: true });
    
    // Listen ke main feed (Mobile Reels)
    // Gunakan interval kecil untuk memastikan elemen .feed sudah di-render
    const attachFeedScroll = setInterval(() => {
        const feedEl = document.getElementById('main-feed');
        if (feedEl) {
            feedEl.addEventListener('scroll', handleScroll, { passive: true });
            clearInterval(attachFeedScroll);
        }
    }, 500);
</script>
<script>
    function adjustVH() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', adjustVH);
    window.addEventListener('orientationchange', adjustVH);
    adjustVH();
</script>
	<script>
/**
 * AUTO GENERATE JSON-LD SCHEMA FOR SEO
 * Fungsi ini membaca PROMPT_DATABASE dan membuat skema ItemList untuk Google
 */
function generateJsonLd() {
    if (typeof PROMPT_DATABASE === 'undefined') return;

    const keys = Object.keys(PROMPT_DATABASE);
    const itemListElement = keys.map((id, index) => {
        return {
            "@type": "ListItem",
            "position": index + 1,
            "name": PROMPT_DATABASE[id].title,
            "url": `${window.location.origin}/prompt.html?id=${id}`,
            "image": `${window.location.origin}/images/${id}.webp`
        };
    });

    const schemaData = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Katalog Prompt AI Cinematic - Kokosima AI",
        "description": "Koleksi prompt AI gratis untuk Midjourney, Dall-E, dan Stable Diffusion.",
        "url": window.location.origin,
        "numberOfItems": keys.length,
        "itemListElement": itemListElement
    };

    // Masukkan ke dalam tag script di head
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.text = JSON.stringify(schemaData);
    document.head.appendChild(script);
}

// Jalankan setelah data.js dimuat
window.addEventListener('load', generateJsonLd);
</script>
